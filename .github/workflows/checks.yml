name: Checks

# Lint, validate and scan the Terraform, the scripts and this workflow, using the shared workflows in
# kerim-kilic/ci-workflows, and test the scrubber. No cloud credentials: nothing is planned or applied.
# No path filters, so every check reports on every pull request and can be required on main.
on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    uses: kerim-kilic/ci-workflows/.github/workflows/terraform.yml@621f9590bd4b4509da7a47a91cbabc6de9f9284c # v1.0.0

  repo:
    uses: kerim-kilic/ci-workflows/.github/workflows/repo-checks.yml@621f9590bd4b4509da7a47a91cbabc6de9f9284c # v1.0.0
    with:
      shellcheck-paths: scripts/*.sh instance/*.sh

  scrubber:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Python 3 is preinstalled on the runner, and the scrubber only uses the standard library.
      - name: Test the scrubber
        run: python3 -m unittest discover -s scripts -v
