# Weekly pull requests for new releases: the GitHub Actions grouped into one, and the AWS provider.
# Cooldown: a new release is only proposed once it is 7 days old, so a compromised release that is pulled quickly never
# reaches this repository.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directory: "/terraform"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
